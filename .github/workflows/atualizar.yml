name: Atualizar monitor

on:
  schedule:
    - cron: "0 12 15 * *"   # dia 15 de cada mês, 9h de Brasília
  workflow_dispatch:         # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: ["src/**", "data/metas_inflacao.csv", ".github/workflows/atualizar.yml"]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q tests/

      - name: Baixar dados e rodar modelos
        run: python src/atualizar.py

      - name: Salvar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processado figures relatorio.md
          git diff --cached --quiet || git commit -m "Atualização mensal: $(date +%Y-%m)"
          git push
